<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生信息管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
           background-image: url('/static/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .login-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* 创建一个新的表单组样式 */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #555;
            display: block;
            text-align: left;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.95rem;
            background-color: white;
            color: #333;
            width: 100%;
            text-align: left;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .role-options {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            justify-content: flex-start;
        }

        .role-options label {
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-login {
            background-color: #0d6efd;
            border: none;
            color: white;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 8px;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }

        .register-link-container {
            text-align: center;
            margin-top: 1rem;
        }

        .register-link {
            font-size: 0.9rem;
            color: #0d6efd;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container w-100 m-auto">
        <form method="post">
            <h2 class="login-title">学生信息管理系统</h2>

            <!-- 消息闪现 -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- 用户名 -->
            <div class="form-group">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <!-- 角色选择 (已删除教师选项) -->
            <div class="role-options">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="role" id="admin" value="admin" checked>
                    <label class="form-check-label" for="admin">管理员</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="role" id="student" value="student">
                    <label class="form-check-label" for="student">学生</label>
                </div>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn btn-login">登录</button>

            <!-- 注册链接 居中对齐 -->
            <div class="register-link-container">
                <a href="{{ url_for('register') }}" class="register-link">还没有账号？立即注册</a>
            </div>
        </form>
    </div>
</body>
</html>

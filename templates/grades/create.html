{% extends "base.html" %}

{% block title %}录入成绩 - 学生信息管理系统{% endblock %}

{% block header %}录入成绩{% endblock %}

{% block actions %}
<a href="{{ url_for('grades') }}" class="btn btn-secondary">返回列表</a>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">录入成绩</h5>
    </div>
    <div class="card-body">
        <form method="post">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="student_id" class="form-label">学生</label>
                    <select class="form-select" id="student_id" name="student_id" required>
                        <option value="">请选择学生</option>
                        {% for student in students %}
                        <option value="{{ student.id }}">{{ student.name }} ({{ student.student_id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="course_id" class="form-label">课程</label>
                    <select class="form-select" id="course_id" name="course_id" required>
                        <option value="">请选择课程</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="semester" class="form-label">学期</label>
                    <select class="form-select" id="semester" name="semester" required>
                        <option value="">请选择学期</option>
                        <option value="2023-2024-1">2023-2024学年 第一学期</option>
                        <option value="2023-2024-2">2023-2024学年 第二学期</option>
                        <option value="2024-2025-1">2024-2025学年 第一学期</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="grade" class="form-label">成绩</label>
                    <input type="number" class="form-control" id="grade" name="grade" min="0" max="100" step="0.1" required>
                    <div class="form-text">请输入0-100之间的分数</div>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">保存成绩</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

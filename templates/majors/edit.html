
{% extends "base.html" %}

{% block title %}编辑专业 - 学生信息管理系统{% endblock %}

{% block header %}编辑专业{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">专业信息</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">专业名称</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ major.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">专业描述</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ major.description }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存更改</button>
                    <a href="{{ url_for('majors') }}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

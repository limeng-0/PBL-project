
{% extends "base.html" %}

{% block title %}编辑课程 - 学生信息管理系统{% endblock %}

{% block header %}编辑课程{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">课程信息</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="code" class="form-label">课程代码</label>
                        <input type="text" class="form-control" id="code" name="code" value="{{ course.code }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">课程名称</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ course.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="credits" class="form-label">学分</label>
                        <input type="number" class="form-control" id="credits" name="credits" min="0" step="0.5" value="{{ course.credits }}">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">课程描述</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ course.description }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存更改</button>
                    <a href="{{ url_for('courses') }}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

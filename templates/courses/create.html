
{% extends "base.html" %}

{% block title %}添加课程 - 学生信息管理系统{% endblock %}

{% block header %}添加课程{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">课程信息</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="code" class="form-label">课程代码</label>
                        <input type="text" class="form-control" id="code" name="code" required>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">课程名称</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="teacher" class="form-label">教师</label>
                        <input type="text" class="form-control" id="teacher" name="teacher">
                    </div>
                    <div class="mb-3">
                        <label for="class_time" class="form-label">上课时间</label>
                        <input type="text" class="form-control" id="class_time" name="class_time" placeholder="例如：周一 8:00-10:00">
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">上课地点</label>
                        <input type="text" class="form-control" id="location" name="location">
                    </div>
                    <div class="mb-3">
                        <label for="max_students" class="form-label">最大选课人数</label>
                        <input type="number" class="form-control" id="max_students" name="max_students" min="1" value="50">
                    </div>
                    <div class="mb-3">
                        <label for="credits" class="form-label">学分</label>
                        <input type="number" class="form-control" id="credits" name="credits" min="0" step="0.5">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">课程描述</label>
                        <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{{ url_for('courses') }}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
